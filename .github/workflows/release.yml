name: Build & Release NavHUD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0). Leave empty for test/build only.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 36.1 platform
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore if configured
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/platform.p12"
            echo "NAVHUD_KEYSTORE_PATH=${RUNNER_TEMP}/platform.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build R8 Release APK
        env:
          NAVHUD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NAVHUD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NAVHUD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare Release Artifact
        run: |
          mkdir -p dist
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          APK_SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            OUT_NAME="NavHUD-${RELEASE_TAG}-release.apk"
          else
            OUT_NAME="NavHUD-${RELEASE_TAG}-release-unsigned.apk"
          fi
          cp "$APK_SRC" "dist/$OUT_NAME"
          sha256sum "dist/$OUT_NAME" > "dist/$OUT_NAME.sha256"
          echo "ASSET_PATH=dist/$OUT_NAME" >> "$GITHUB_ENV"
          echo "SHA_PATH=dist/$OUT_NAME.sha256" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavHUD-release-apk
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          gh release create "$RELEASE_TAG" "$ASSET_PATH" "$SHA_PATH" \
            --title "NavHUD $RELEASE_TAG" \
            --generate-notes || gh release upload "$RELEASE_TAG" "$ASSET_PATH" "$SHA_PATH" --clobber
